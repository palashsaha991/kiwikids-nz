groups:
  - name: kiwikids-platform

    rules:

      - alert: KiwiKidsAPIDown
        expr: up{job="kiwikids-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KiwiKids API is down"
          description: "Prometheus cannot scrape the KiwiKids API for more than 1 minute."

      - alert: KiwiKidsPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL monitoring is unavailable"
          description: "Prometheus cannot scrape the PostgreSQL exporter."

      - alert: KiwiKidsHighHTTP5xxRate
        expr: |
          sum(rate(kiwikids_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(kiwikids_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KiwiKids API 5xx rate is high"
          description: "More than 5 percent of API responses are HTTP 5xx."

      - alert: KiwiKidsHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(kiwikids_http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KiwiKids API latency is high"
          description: "API p95 latency has exceeded 1 second for 5 minutes."
