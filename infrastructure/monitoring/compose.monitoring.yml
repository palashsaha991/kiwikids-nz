services:

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: kiwikids-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    networks:
      - app
      - data

    ports:
      - "127.0.0.1:9090:9090"

    security_opt:
      - no-new-privileges:true


  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: kiwikids-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "postgres:5432/kiwikids?sslmode=disable"
      DATA_SOURCE_USER: "kiwikids_monitor"
      DATA_SOURCE_PASS_FILE: /run/secrets/monitor_db_password

    command:
      - --no-collector.wal

    secrets:
      - monitor_db_password

    group_add:
      - "10001"

    networks:
      - data

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev


  grafana:
    image: grafana/grafana:12.2.0
    container_name: kiwikids-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

    secrets:
      - grafana_admin_password

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - app

    ports:
      - "127.0.0.1:3001:3000"

    security_opt:
      - no-new-privileges:true


secrets:
  runtime_db_password:
    file: /srv/kiwikids-secrets/runtime_db_password

  monitor_db_password:
    file: /srv/kiwikids-secrets/monitor_db_password

  grafana_admin_password:
    file: /srv/kiwikids-secrets/grafana_admin_password


networks:
  app:
    external: true
    name: kiwikids-app

  data:
    external: true
    name: kiwikids-data


volumes:
  prometheus-data:
  grafana-data:
